spring:
  application:
    name: billing-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  mvc:
    problemdetails:
      enabled: true
  mongodb:
    uri: ${BILLING_MONGO_URI:mongodb://localhost:27017/medical_billing}
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    consumer:
      group-id: billing-service-group
      auto-offset-reset: earliest
  grpc:
    server:
      port: ${BILLING_GRPC_PORT:9090}
      keepalive:
        connection:
          max-age: 2m
          grace-period: 30s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/medical-center}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8180/realms/medical-center/protocol/openid-connect/certs}

server:
  port: ${BILLING_SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,diskSpace
      show-details: when-authorized
  health:
    liveness:
      state:
        enabled: true
    readiness:
      state:
        enabled: true

app:
  kafka:
    topics:
      appointment-cancelled: medical.appointment.cancelled
      appointment-completed: medical.appointment.completed
