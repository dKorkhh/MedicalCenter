spring:
  application:
    name: billing-service
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  mvc:
    problemdetails:
      enabled: true
  mongodb:
    uri: ${BILLING_MONGO_URI:mongodb://localhost:27017/medical_billing}

server:
  port: ${BILLING_SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,diskSpace
      show-details: when-authorized
  health:
    liveness:
      state:
        enabled: true
    readiness:
      state:
        enabled: true