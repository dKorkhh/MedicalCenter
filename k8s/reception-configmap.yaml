apiVersion: v1
kind: ConfigMap
metadata:
  name: reception-config
  namespace: medical-center
  labels:
    app: reception-service
data:
  SERVER_PORT: "8081"
  RECEPTION_SERVER_PORT: "8081"
  RECEPTION_DB_NAME: "reception"
  RECEPTION_MONGO_URI: "mongodb://reception-db:27017/reception"
  SPRING_DATA_MONGODB_URI: "mongodb://reception-db:27017/reception"
  SPRING_MONGODB_URI: "mongodb://reception-db:27017/reception"
  RECEPTION_SERVICE_URL: "http://reception-service:8081"
  BILLING_SERVICE_URL: "http://billing-service:8082"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
