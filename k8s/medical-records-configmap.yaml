  SPRING_DATA_MONGODB_URI: "mongodb://medical-records-db:27017/medical_records"
  SPRING_MONGODB_URI: "mongodb://medical-records-db:27017/medical_records"
  MEDICAL_RECORDS_SERVICE_URL: "http://medical-records-service:8083"
