apiVersion: v1
kind: ConfigMap
metadata:
  name: medical-records-config
  namespace: medical-center
  labels:
    app: medical-records-service
data:
  SERVER_PORT: "8083"
  MEDICAL_RECORDS_SERVER_PORT: "8083"
  MEDICAL_RECORDS_DB_NAME: "medical_records"
