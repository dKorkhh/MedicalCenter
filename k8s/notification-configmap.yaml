apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: medical-center
  labels:
    app: notification-service
data:
  SERVER_PORT: "8084"
  NOTIFICATION_SERVER_PORT: "8084"
  NOTIFICATION_DB_NAME: "notification"
  NOTIFICATION_MONGO_URI: "mongodb://notification-db:27017/notification"
  SPRING_DATA_MONGODB_URI: "mongodb://notification-db:27017/notification"
  SPRING_MONGODB_URI: "mongodb://notification-db:27017/notification"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8084"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
