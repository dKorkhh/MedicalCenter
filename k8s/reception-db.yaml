apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reception-db-pvc
  namespace: medical-center
  labels:
    app: reception-db
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reception-db
  namespace: medical-center
  labels:
    app: reception-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: reception-db
  template:
    metadata:
      labels:
        app: reception-db
    spec:
      containers:
        - name: mongo
          image: mongo:7.0
          args: ["--replSet", "rs0", "--bind_ip_all"]
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      if mongosh --quiet --eval "rs.status().ok" 2>/dev/null | grep -q 1; then
                        exit 0
                      fi
                      mongosh --quiet --eval "rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'reception-db:27017'}]})" >/dev/null 2>&1 || true
                      sleep 2
                    done
                    exit 0
          ports:
            - containerPort: 27017
              name: mongodb
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: reception-db-storage
              mountPath: /data/db
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: reception-db-storage
          persistentVolumeClaim:
            claimName: reception-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: reception-db
  namespace: medical-center
  labels:
    app: reception-db
spec:
  type: ClusterIP
  selector:
    app: reception-db
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
