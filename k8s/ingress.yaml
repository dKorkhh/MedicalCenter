apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medical-center-ingress
  namespace: medical-center
  labels:
    app: medical-ingress
    app.kubernetes.io/name: medical-center
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: reception-service
                port:
                  number: 8081
