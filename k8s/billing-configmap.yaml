apiVersion: v1
kind: ConfigMap
metadata:
  name: billing-config
  namespace: medical-center
  labels:
    app: billing-service
data:
  SERVER_PORT: "8082"
  BILLING_SERVER_PORT: "8082"
  BILLING_DB_NAME: "billing"
  BILLING_MONGO_URI: "mongodb://billing-db:27017/billing"
  SPRING_DATA_MONGODB_URI: "mongodb://billing-db:27017/billing"
  SPRING_MONGODB_URI: "mongodb://billing-db:27017/billing"
  BILLING_SERVICE_URL: "http://billing-service:8082"
