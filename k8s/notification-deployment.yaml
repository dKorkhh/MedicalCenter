apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: medical-center
  labels:
    app: notification-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8084"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
      - name: notification-service
        image: medical-notification:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8084
        envFrom:
        - configMapRef:
            name: notification-config
        env:
          - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
            value: kafka:9092
          - name: MAIL_USERNAME
            valueFrom:
              secretKeyRef:
                name: medical-secrets
                key: MAIL_USERNAME
          - name: MAIL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: medical-secrets
                key: MAIL_PASSWORD
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8084
          failureThreshold: 60
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8084
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8084
          initialDelaySeconds: 5
          periodSeconds: 5
        lifecycle:
          preStop:
            exec:
              command: ["sleep", "5"]
