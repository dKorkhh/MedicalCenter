spring:
  application:
    name: reception-service
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  data:
    mongodb:
      uri: "${RECEPTION_MONGO_URI:mongodb://localhost:27017/medical_reception}"
      transaction:
        enabled: ${MONGODB_TRANSACTION_ENABLED:true}
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    template:
      observation-enabled: true
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${RECEPTION_SERVER_PORT:8081}

billing:
  service:
    url: ${BILLING_SERVICE_URL:http://localhost:8082}

medical-records:
  service:
    url: ${MEDICAL_RECORDS_SERVICE_URL:http://localhost:8083}

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    resource-attributes:
      service.namespace: medical-center
      deployment.environment: k8s
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,diskSpace
      show-details: when-authorized
  health:
    liveness:
      state:
        enabled: true
    readiness:
      state:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      billingClient:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2000ms
        waitDurationInOpenState: 10000ms
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    instances:
      billingClient:
        maxAttempts: 3
        waitDuration: 1000ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2.0
        randomizedWaitDuration: 500ms
        retryExceptions:
          - org.springframework.web.client.ResourceAccessException
          - java.io.IOException
          - org.springframework.web.server.ResponseStatusException
  bulkhead:
    instances:
      billingClient:
        maxConcurrentCalls: 10
        maxWaitDuration: 0ms

app:
  kafka:
    topics:
      appointment-booked: medical.appointment.booked
  outbox:
    publisher:
      enabled: ${OUTBOX_PUBLISHER_ENABLED:true}
    polling-interval-ms: ${OUTBOX_POLLING_INTERVAL_MS:2000}
    max-retries: 5

logging:
  structured:
    format:
      console: logstash
