server:
  port: 8081

spring:
  application:
    name: reception-service
  data:
    mongodb:
      transaction:
        enabled: false
  kafka:
    bootstrap-servers: localhost:9092
    admin:
      fail-on-error: false
      auto-create: false
  mongodb:
    uri: mongodb://localhost:27017/medical_reception

app:
  outbox:
    publisher:
      enabled: false

management:
  tracing:
    export:
      enabled: false
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ""
