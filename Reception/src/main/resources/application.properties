spring.application.name=reception-service
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]
server.port=${RECEPTION_SERVER_PORT:8081}
billing.service.url=http://localhost:8082
spring.data.mongodb.uri=${RECEPTION_MONGO_URI:mongodb://localhost:27017/medical_reception}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

spring.mvc.problemdetails.enabled=true

resilience4j.circuitbreaker.instances.billingClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.billingClient.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.billingClient.slidingWindowSize=10
resilience4j.circuitbreaker.instances.billingClient.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.billingClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.billingClient.slowCallRateThreshold=100
resilience4j.circuitbreaker.instances.billingClient.slowCallDurationThreshold=2000ms
resilience4j.circuitbreaker.instances.billingClient.waitDurationInOpenState=10000ms
resilience4j.circuitbreaker.instances.billingClient.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.billingClient.automaticTransitionFromOpenToHalfOpenEnabled=true

resilience4j.retry.instances.billingClient.maxAttempts=3
resilience4j.retry.instances.billingClient.waitDuration=1000ms
resilience4j.retry.instances.billingClient.enableExponentialBackoff=true
resilience4j.retry.instances.billingClient.exponentialBackoffMultiplier=2.0
resilience4j.retry.instances.billingClient.randomizedWaitDuration=500ms
resilience4j.retry.instances.billingClient.retryExceptions=org.springframework.web.client.ResourceAccessException,java.io.IOException,org.springframework.web.server.ResponseStatusException

resilience4j.bulkhead.instances.billingClient.maxConcurrentCalls=10
resilience4j.bulkhead.instances.billingClient.maxWaitDuration=0ms