spring:
  application:
    name: notification-service
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  mvc:
    problemdetails:
      enabled: true
  kafka:
    bootstrap-servers: "${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}"
    consumer:
      group-id: notification-service-group
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  data:
    mongodb:
      uri: ${NOTIFICATION_MONGO_URI:mongodb://localhost:27017/medical_notification}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${NOTIFICATION_SERVER_PORT:8084}

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      type: w3c
  opentelemetry:
    resource-attributes:
      service.namespace: medical-center
      deployment.environment: k8s
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_COLLECTOR_ENDPOINT:http://localhost:4318}/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,diskSpace
      show-details: when-authorized
  health:
    liveness:
      state:
        enabled: true
    readiness:
      state:
        enabled: true

app:
  kafka:
    topics:
      appointment-booked: medical.appointment.booked

logging:
  structured:
    format:
      console: logstash
