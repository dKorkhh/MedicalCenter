services:
  reception-db:
    image: ${MONGO_IMAGE}
    container_name: reception-db
    restart: always
    ports:
      - "${RECEPTION_DB_PORT}:27017"
    volumes:
      - reception_data:/data/db
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  billing-db:
    image: ${MONGO_IMAGE}
    container_name: billing-db
    restart: always
    ports:
      - "${BILLING_DB_PORT}:27017"
    volumes:
      - billing_data:/data/db
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  medical-records-db:
    image: ${MONGO_IMAGE}
    container_name: medical-records-db
    restart: always
    ports:
      - "${MEDICAL_RECORDS_DB_PORT}:27017"
    volumes:
      - medical_records_data:/data/db
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  notification-db:
    image: ${MONGO_IMAGE}
    container_name: notification-db
    restart: always
    ports:
      - "${NOTIFICATION_DB_PORT}:27017"
    volumes:
      - notification_data:/data/db
    networks:
      - medical-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  reception-service:
    build:
      context: ./Reception
      dockerfile: Dockerfile
    container_name: reception-service
    restart: always
    ports:
      - "${RECEPTION_SERVER_PORT}:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_MONGODB_URI: mongodb://reception-db:27017/${RECEPTION_DB_NAME}
      SPRING_DATA_MONGODB_URI: mongodb://reception-db:27017/${RECEPTION_DB_NAME}
      RECEPTION_MONGO_URI: mongodb://reception-db:27017/${RECEPTION_DB_NAME}
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jpa.autoconfigure.HibernateJpaAutoConfiguration
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      reception-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - medical-network

  billing-service:
    build:
      context: ./Billing
      dockerfile: Dockerfile
    container_name: billing-service
    restart: always
    ports:
      - "${BILLING_SERVER_PORT}:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_MONGODB_URI: mongodb://billing-db:27017/${BILLING_DB_NAME}
      SPRING_DATA_MONGODB_URI: mongodb://billing-db:27017/${BILLING_DB_NAME}
      BILLING_MONGO_URI: mongodb://billing-db:27017/${BILLING_DB_NAME}
      SPRING_AUTOCONFIGURE_EXCLUDE: org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.jpa.autoconfigure.HibernateJpaAutoConfiguration
    depends_on:
      billing-db:
        condition: service_healthy
    networks:
      - medical-network

  medical-records-service:
    build:
      context: ./MedicalRecords
      dockerfile: Dockerfile
    container_name: medical-records-service
    restart: always
    ports:
      - "${MEDICAL_RECORDS_SERVER_PORT}:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_MONGODB_URI: mongodb://medical-records-db:27017/${MEDICAL_RECORDS_DB_NAME}
      SPRING_DATA_MONGODB_URI: mongodb://medical-records-db:27017/${MEDICAL_RECORDS_DB_NAME}
      MEDICAL_RECORDS_MONGO_URI: mongodb://medical-records-db:27017/${MEDICAL_RECORDS_DB_NAME}
    depends_on:
      medical-records-db:
        condition: service_healthy
    networks:
      - medical-network

  notification-service:
    build:
      context: ./Notification
      dockerfile: Dockerfile
    container_name: notification-service
    restart: always
    ports:
      - "${NOTIFICATION_SERVER_PORT}:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_MONGODB_URI: mongodb://notification-db:27017/${NOTIFICATION_DB_NAME}
      SPRING_DATA_MONGODB_URI: mongodb://notification-db:27017/${NOTIFICATION_DB_NAME}
      NOTIFICATION_MONGO_URI: mongodb://notification-db:27017/${NOTIFICATION_DB_NAME}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - medical-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: medical-kafka
    restart: always
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:9092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - medical-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: medical-kafka-ui
    restart: always
    ports:
      - "${KAFKA_UI_PORT:-8085}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: medical-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - medical-network

networks:
  medical-network:
    driver: bridge

volumes:
  reception_data:
  billing_data:
  medical_records_data:
  notification_data:
